name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-smoke-test:
    name: Lint scripts and smoke-test fetchsub
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install lightweight lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: ShellCheck bash entrypoints
        run: shellcheck grab postdl

      - name: Ruff check fetchsub
        run: ruff check --select F fetchsub

      - name: Python syntax check fetchsub
        run: python -m py_compile fetchsub

      - name: fetchsub help smoke test
        run: python fetchsub --help

      - name: fetchsub no-network dry run without API keys
        run: |
          set -euo pipefail
          tmp_home="$(mktemp -d)"
          tmp_media="$(mktemp -d)"
          trap 'rm -rf "$tmp_home" "$tmp_media"' EXIT
          mkdir -p "$tmp_home/.config/opensubtitles" "$tmp_home/.config/subdl"
          touch "$tmp_media/example.S01E01.mkv"
          output="$(HOME="$tmp_home" python fetchsub --dry-run "$tmp_media")"
          printf '%s\n' "$output"
          grep -q "example.S01E01.mkv" <<<"$output"
          grep -q "dry-run: 1 video(s) found" <<<"$output"
